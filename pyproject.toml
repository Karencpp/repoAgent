[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-agent"
version = "0.1.0"
description = "An interview-oriented, explainable Python repository maintenance agent."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
    "pytest>=8,<10",
]

[project.optional-dependencies]
postgres = [
    "alembic>=1.13,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
repo-agent = "repo_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
