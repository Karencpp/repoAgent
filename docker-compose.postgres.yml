services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repo_agent
      POSTGRES_USER: repo_agent
      POSTGRES_PASSWORD: repo_agent_dev_password
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_agent -d repo_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - repo_agent_postgres:/var/lib/postgresql/data

volumes:
  repo_agent_postgres:
